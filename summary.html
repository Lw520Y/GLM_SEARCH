<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>使用汇总 · GLM Console</title>
    <link rel="stylesheet" href="styles/common.css">
</head>
<body data-page="summary">
    <main class="main">
        <div class="content">
            <section class="card">
                <div class="card-header toolbar">
                    <div class="card-title-group">
                        <h2 class="card-title">月度使用汇总</h2>
                        <p class="card-subtitle">选择月份，汇总所有 Key 的 Token 消耗</p>
                    </div>
                    <div class="toolbar-controls">
                        <select class="select" id="yearSelect" aria-label="选择年份"></select>
                        <select class="select" id="monthSelect" aria-label="选择月份"></select>
                        <button class="btn btn-primary" id="summaryQueryBtn" type="button" onclick="loadSummary()">查询</button>
                        <button class="btn btn-secondary" type="button" onclick="exportSummary()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
                            导出
                        </button>
                    </div>
                </div>
            </section>

            <section class="stats-grid stats-grid-3" aria-label="汇总概览">
                <div class="stat-card">
                    <div class="stat-head">
                        <span class="stat-label">Key 数量</span>
                        <span class="stat-icon tint-blue">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
                        </span>
                    </div>
                    <div class="stat-value" id="totalKeys">0</div>
                    <div class="stat-sub">参与汇总的 Key</div>
                </div>
                <div class="stat-card">
                    <div class="stat-head">
                        <span class="stat-label">总使用量</span>
                        <span class="stat-icon tint-violet">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
                        </span>
                    </div>
                    <div class="stat-value" id="totalUsage">0</div>
                    <div class="stat-sub">所选月份 Token 合计</div>
                </div>
                <div class="stat-card">
                    <div class="stat-head">
                        <span class="stat-label">平均使用量</span>
                        <span class="stat-icon tint-amber">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2.5-7 5 14 2.5-7h4"/></svg>
                        </span>
                    </div>
                    <div class="stat-value" id="avgUsage">0</div>
                    <div class="stat-sub">按全部 Key 计算</div>
                </div>
            </section>

            <section class="card">
                <div class="card-header">
                    <div class="card-title-group">
                        <h2 class="card-title">Key 用量明细</h2>
                        <p class="card-subtitle">按使用量从高到低排序</p>
                    </div>
                    <span class="badge badge-neutral" id="summaryMonthLabel">--</span>
                </div>

                <div class="table-wrap" id="tableWrap">
                    <table class="table" id="summaryTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Key 名称</th>
                                <th>API Key</th>
                                <th>使用量</th>
                                <th>占比</th>
                                <th>使用分布</th>
                            </tr>
                        </thead>
                        <tbody id="keyTableBody"></tbody>
                    </table>
                </div>

                <div class="empty-state key-empty" id="summaryEmpty" hidden>
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
                    </div>
                    <h3>暂无汇总数据</h3>
                    <p>请先在控制台添加并保存 API Key，汇总页会自动查询所有 Key 的月度用量。</p>
                    <a class="btn btn-primary" href="index.html">去添加 Key</a>
                </div>
            </section>

            <p class="page-footnote">数据来源：智谱 AI 财务账单接口，汇总结果仅供参考。</p>
        </div>
    </main>

    <div class="loading-overlay" id="loadingOverlay" role="status" aria-live="polite">
        <div class="loading-panel">
            <div class="spinner"></div>
            <p id="loadingText">正在查询中…</p>
        </div>
    </div>

    <script src="js/layout.js"></script>
    <script src="js/common.js"></script>
    <script>
        let summaryResults = [];

        const $ = id => document.getElementById(id);

        window.addEventListener('load', async function () {
            await loadKeys();
            initMonthSelectors();
            await loadSummary({ initial: true });
        });

        function nameInitial(name) {
            const value = String(name || 'K').trim();
            return Array.from(value)[0] || 'K';
        }

        function initMonthSelectors() {
            const yearSelect = $('yearSelect');
            const monthSelect = $('monthSelect');
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;

            yearSelect.innerHTML = '';
            monthSelect.innerHTML = '';

            for (let year = currentYear; year >= currentYear - 2; year--) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = `${year} 年`;
                if (year === currentYear) option.selected = true;
                yearSelect.appendChild(option);
            }

            for (let month = 1; month <= 12; month++) {
                const option = document.createElement('option');
                option.value = String(month).padStart(2, '0');
                option.textContent = `${month} 月`;
                if (month === currentMonth) option.selected = true;
                monthSelect.appendChild(option);
            }
        }

        async function loadSummary(options = {}) {
            const year = $('yearSelect').value;
            const month = $('monthSelect').value;
            const monthParam = `${year}-${month}`;
            $('summaryMonthLabel').textContent = monthParam;

            if (storedKeys.length === 0) {
                summaryResults = [];
                updateStats([]);
                renderTable([]);
                if (!options.initial) showToast('暂无保存的 Key', 'info');
                return;
            }

            showLoading(`正在查询 0 / ${storedKeys.length}…`);

            const results = [];
            let completed = 0;
            let failed = 0;

            try {
                for (const item of storedKeys) {
                    let usage = 0;
                    let error = null;

                    try {
                        const response = await fetch(`${API_BASE}/api/usage?key=${encodeURIComponent(item.key)}&month=${monthParam}`);
                        const data = await response.json();
                        if (data.code === 200 && data.rows) {
                            usage = extractKeyUsage(data.rows, item.key);
                        } else {
                            error = data.msg || '查询失败';
                        }
                    } catch (fetchError) {
                        error = fetchError.message;
                    }

                    if (error) failed++;
                    results.push({
                        name: item.name || '未命名 Key',
                        key: item.key,
                        usage: usage,
                        error: error
                    });

                    completed++;
                    $('loadingText').textContent = `正在查询 ${completed} / ${storedKeys.length}…`;
                }

                results.sort((a, b) => b.usage - a.usage);
                summaryResults = results;

                updateStats(results);
                renderTable(results);

                if (failed > 0) {
                    showToast(`${failed} 个 Key 查询失败，其余数据已更新`, 'error');
                }
            } finally {
                hideLoading();
            }
        }

        function updateStats(results) {
            const totalUsage = results.reduce((sum, item) => sum + (item.usage || 0), 0);

            $('totalKeys').textContent = storedKeys.length;
            $('totalUsage').textContent = formatTokenCount(totalUsage);
            $('avgUsage').textContent = storedKeys.length > 0
                ? formatTokenCount(Math.round(totalUsage / storedKeys.length))
                : '0';
        }

        function renderTable(results) {
            const tableWrap = $('tableWrap');
            const emptyState = $('summaryEmpty');
            const tbody = $('keyTableBody');

            if (results.length === 0) {
                tbody.innerHTML = '';
                tableWrap.hidden = true;
                emptyState.hidden = false;
                return;
            }

            tableWrap.hidden = false;
            emptyState.hidden = true;

            const totalUsage = results.reduce((sum, item) => sum + (item.usage || 0), 0);

            tbody.innerHTML = results.map((item, index) => {
                const percent = totalUsage > 0 ? (item.usage / totalUsage) * 100 : 0;
                const rankClass = index === 0 ? 'rank top' : 'rank';
                return `
                    <tr title="${item.error ? escapeHtml(item.error) : ''}">
                        <td><span class="${rankClass}">${index + 1}</span></td>
                        <td>
                            <div class="name-cell">
                                <span class="avatar">${escapeHtml(nameInitial(item.name))}</span>
                                <span class="strong name-text">${escapeHtml(item.name)}</span>
                            </div>
                        </td>
                        <td><span class="mono muted">${escapeHtml(maskKey(item.key))}</span></td>
                        <td><span class="usage-value">${formatTokenCount(item.usage || 0)}</span></td>
                        <td><span class="percent-text">${percent.toFixed(1)}%</span></td>
                        <td>
                            <div class="usage-bar">
                                <div class="usage-bar-fill" style="width: ${percent}%"></div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function exportSummary() {
            if (summaryResults.length === 0) {
                showToast('暂无可导出的汇总数据', 'info');
                return;
            }

            const year = $('yearSelect').value;
            const month = $('monthSelect').value;
            const monthParam = `${year}-${month}`;
            const totalUsage = summaryResults.reduce((sum, item) => sum + (item.usage || 0), 0);

            exportData(`glm-summary-${monthParam}.json`, {
                month: monthParam,
                exportTime: new Date().toISOString(),
                totalUsage: totalUsage,
                data: summaryResults.map(item => ({
                    name: item.name,
                    key: maskKey(item.key),
                    usage: item.usage || 0,
                    error: item.error || null
                }))
            });
            showToast('已导出汇总数据', 'success');
        }

        function showLoading(text) {
            $('loadingText').textContent = text || '正在查询中…';
            $('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            $('loadingOverlay').classList.remove('active');
        }
    </script>
</body>
</html>
