<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key 管理 · GLM Console</title>
    <link rel="stylesheet" href="styles/common.css">
</head>
<body data-page="keys">
    <main class="main">
        <div class="content">
            <section class="stats-grid" aria-label="Key 概览">
                <div class="stat-card">
                    <div class="stat-head">
                        <span class="stat-label">Key 总数</span>
                        <span class="stat-icon tint-blue">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
                        </span>
                    </div>
                    <div class="stat-value" id="totalKeys">0</div>
                    <div class="stat-sub">已保存到本地</div>
                </div>
                <div class="stat-card">
                    <div class="stat-head">
                        <span class="stat-label">已查询</span>
                        <span class="stat-icon tint-green">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
                        </span>
                    </div>
                    <div class="stat-value" id="queriedCount">0</div>
                    <div class="stat-sub">本次会话已获取用量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-head">
                        <span class="stat-label">本月总用量</span>
                        <span class="stat-icon tint-violet">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
                        </span>
                    </div>
                    <div class="stat-value" id="totalUsage">0</div>
                    <div class="stat-sub">已查询 Key 合计</div>
                </div>
                <div class="stat-card">
                    <div class="stat-head">
                        <span class="stat-label">平均用量</span>
                        <span class="stat-icon tint-amber">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2.5-7 5 14 2.5-7h4"/></svg>
                        </span>
                    </div>
                    <div class="stat-value" id="avgUsage">0</div>
                    <div class="stat-sub">按已查询 Key 计算</div>
                </div>
            </section>

            <section class="card">
                <div class="card-header toolbar">
                    <div class="card-title-group">
                        <h2 class="card-title">已保存的 Key</h2>
                        <p class="card-subtitle" id="keyCountHint">共 0 个 Key</p>
                    </div>
                    <div class="toolbar-actions">
                        <button class="btn btn-secondary" id="refreshAllBtn" type="button" onclick="refreshAll(this)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
                            刷新全部
                        </button>
                        <button class="btn btn-secondary" type="button" onclick="exportDataFile()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
                            导出 JSON
                        </button>
                    </div>
                </div>

                <div class="table-wrap" id="tableWrap">
                    <table class="table" id="keyTable">
                        <thead>
                            <tr>
                                <th>Key 名称</th>
                                <th>API Key</th>
                                <th>添加时间</th>
                                <th>本月用量</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="keyTableBody"></tbody>
                    </table>
                </div>

                <div class="empty-state key-empty" id="emptyState" hidden>
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
                    </div>
                    <h3>暂无保存的 Key</h3>
                    <p>请先在控制台输入并保存 API Key，之后即可在这里统一管理和查询用量。</p>
                    <a class="btn btn-primary" href="index.html">去添加 Key</a>
                </div>
            </section>

            <p class="page-footnote">数据存储在服务器 data/ 目录，点击「查询」可实时获取本月用量。</p>
        </div>
    </main>

    <div class="modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="detailModalTitle">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3 class="modal-title" id="detailModalTitle">Key 详情</h3>
                <button class="modal-close" type="button" onclick="closeModal()" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-grid" id="detailGrid"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" onclick="closeModal()">关闭</button>
            </div>
        </div>
    </div>

    <script src="js/layout.js"></script>
    <script src="js/common.js"></script>
    <script>
        let keyResults = {};

        const $ = id => document.getElementById(id);

        window.addEventListener('load', async function () {
            await loadKeys();
            renderKeyList();
        });

        function nameInitial(name) {
            const value = String(name || 'K').trim();
            return Array.from(value)[0] || 'K';
        }

        function formatDateTime(iso) {
            if (!iso) return '-';
            const date = new Date(iso);
            if (Number.isNaN(date.getTime())) return '-';
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
        }

        function resultStatus(result) {
            if (!result) return { className: 'badge-neutral', text: '未查询' };
            if ((result.usage || 0) > 0) return { className: 'badge-success', text: '有使用' };
            return { className: 'badge-warning', text: '无用量' };
        }

        function renderKeyList() {
            const tbody = $('keyTableBody');
            const tableWrap = $('tableWrap');
            const emptyState = $('emptyState');

            $('keyCountHint').textContent = `共 ${storedKeys.length} 个 Key`;

            if (storedKeys.length === 0) {
                tbody.innerHTML = '';
                tableWrap.hidden = true;
                emptyState.hidden = false;
                updateStats();
                return;
            }

            tableWrap.hidden = false;
            emptyState.hidden = true;

            tbody.innerHTML = storedKeys.map((item, index) => {
                const result = keyResults[item.key];
                const status = resultStatus(result);
                const usageText = result ? formatTokenCount(result.usage || 0) : '--';
                return `
                    <tr>
                        <td>
                            <div class="name-cell">
                                <span class="avatar">${escapeHtml(nameInitial(item.name))}</span>
                                <span class="strong name-text">${escapeHtml(item.name || '未命名 Key')}</span>
                            </div>
                        </td>
                        <td><span class="mono muted">${escapeHtml(maskKey(item.key))}</span></td>
                        <td class="muted">${escapeHtml(formatDateTime(item.addedTime))}</td>
                        <td><span class="usage-value">${usageText}</span></td>
                        <td><span class="badge ${status.className}">${status.text}</span></td>
                        <td>
                            <div class="actions-cell">
                                <button class="btn btn-sm btn-secondary" type="button" onclick="queryKey(${index}, this)">查询</button>
                                <button class="btn btn-sm btn-ghost" type="button" onclick="showDetail(${index})">详情</button>
                                <button class="btn btn-sm btn-ghost-danger" type="button" onclick="deleteKey(${index})">删除</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function fetchKeyUsage(item) {
            const monthParam = new Date().toISOString().substring(0, 7);
            const response = await fetch(`${API_BASE}/api/usage?key=${encodeURIComponent(item.key)}&month=${monthParam}`);
            const data = await response.json();
            if (data.code !== 200 || !data.rows) {
                throw new Error(data.msg || '查询失败');
            }
            return extractKeyUsage(data.rows, item.key);
        }

        async function queryKey(index, btn) {
            const item = storedKeys[index];
            if (!item) return;

            const original = btn ? btn.innerHTML : '';
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-sm"></span>查询中';
            }

            try {
                const usage = await fetchKeyUsage(item);
                keyResults[item.key] = { usage: usage, time: new Date().toISOString() };
                renderKeyList();
                updateStats();
                showToast(`「${item.name || '未命名 Key'}」本月用量已更新`, 'success');
            } catch (error) {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = original;
                }
                showToast(error.message || '查询失败', 'error');
            }
        }

        async function refreshAll(btn) {
            if (storedKeys.length === 0) {
                showToast('暂无保存的 Key', 'info');
                return;
            }

            const original = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-sm"></span>刷新中';

            let success = 0;
            let failed = 0;

            for (const item of storedKeys) {
                try {
                    const usage = await fetchKeyUsage(item);
                    keyResults[item.key] = { usage: usage, time: new Date().toISOString() };
                    success++;
                } catch (error) {
                    failed++;
                }
            }

            renderKeyList();
            updateStats();

            btn.disabled = false;
            btn.innerHTML = original;

            if (failed > 0) {
                showToast(`已刷新 ${success} 个 Key，${failed} 个查询失败`, 'error');
            } else {
                showToast(`已刷新全部 ${success} 个 Key`, 'success');
            }
        }

        async function showDetail(index) {
            const item = storedKeys[index];
            if (!item) return;

            let result = keyResults[item.key];
            if (!result) {
                try {
                    const usage = await fetchKeyUsage(item);
                    result = { usage: usage, time: new Date().toISOString() };
                    keyResults[item.key] = result;
                    renderKeyList();
                    updateStats();
                } catch (error) {
                    showToast(error.message || '查询失败', 'error');
                    return;
                }
            }

            const status = resultStatus(result);
            const usage = result.usage || 0;

            $('detailGrid').innerHTML = `
                <div class="detail-item">
                    <div class="detail-label">Key 名称</div>
                    <div class="detail-value">${escapeHtml(item.name || '未命名 Key')}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">API Key</div>
                    <div class="detail-value mono">${escapeHtml(maskKey(item.key))}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">添加时间</div>
                    <div class="detail-value">${escapeHtml(formatDateTime(item.addedTime))}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">查询时间</div>
                    <div class="detail-value">${escapeHtml(formatDateTime(result.time))}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">本月用量</div>
                    <div class="detail-value">${formatTokenCount(usage)} Token</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">状态</div>
                    <div class="detail-value"><span class="badge ${status.className}">${status.text}</span></div>
                </div>
            `;

            $('detailModal').classList.add('active');
        }

        function closeModal() {
            $('detailModal').classList.remove('active');
        }

        async function deleteKey(index) {
            const item = storedKeys[index];
            if (!item) return;
            if (!confirm(`确定要删除 Key「${item.name || '未命名 Key'}」吗？`)) return;

            try {
                const response = await fetch(`${API_BASE}/api/keys/delete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: item.key })
                });
                const data = await response.json();
                if (data.code === 200) {
                    storedKeys = data.data;
                    delete keyResults[item.key];
                    renderKeyList();
                    updateStats();
                    showToast('Key 已删除', 'success');
                } else {
                    showToast(data.msg || '删除失败', 'error');
                }
            } catch (error) {
                showToast('删除失败：' + error.message, 'error');
            }
        }

        function updateStats() {
            $('totalKeys').textContent = storedKeys.length;

            const results = storedKeys
                .map(item => keyResults[item.key])
                .filter(Boolean);
            const totalUsage = results.reduce((sum, result) => sum + (result.usage || 0), 0);

            $('queriedCount').textContent = results.length;
            $('totalUsage').textContent = formatTokenCount(totalUsage);
            $('avgUsage').textContent = results.length > 0
                ? formatTokenCount(Math.round(totalUsage / results.length))
                : '0';
        }

        function exportDataFile() {
            if (storedKeys.length === 0) {
                showToast('暂无可导出的 Key', 'info');
                return;
            }

            exportData(`glm-keys-${new Date().toISOString().split('T')[0]}.json`, {
                keys: storedKeys,
                results: keyResults,
                exportTime: new Date().toISOString()
            });
            showToast('已导出 Key 数据', 'success');
        }

        $('detailModal').addEventListener('click', function (event) {
            if (event.target === this) closeModal();
        });

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && $('detailModal').classList.contains('active')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
